name: ci

on:
  push:
  pull_request:

# One run per ref: a second push to the same branch cancels the first, so a superseded run
# cannot finish red and leave the pull request marked with a failure that no longer exists.
# PR runs live under their own ref, so they are never cancelled by a push to the branch — the
# two are different questions (the merge result and the branch) and both are worth answering.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify M0 foundation
        run: make verify-m0

      - name: Verify M1 venue and layout flow
        run: make verify-m1

      # The milestone's exit evidence: one winner in sixteen contenders, the
      # durable expiry worker, and recovery after a killed sweep. It needs the
      # compose dependencies, which the previous steps already started.
      - name: Verify M2 reservation core
        run: make verify-m2

  # The M3 gate is its own job so the foundation checks keep their shape and their
  # runtime: this one starts the same three compose services (Floci is pinned by
  # digest in the compose file), bootstraps the stack the way a developer does, and
  # then proves the milestone end to end against them — a hold, a payment, the
  # tickets, the signed code, the PDF in the bucket and its survival across a Floci
  # restart. `make verify-m3` also refuses to run without jq and openssl, which the
  # runner image carries; they are checked explicitly so a missing tool is a clear
  # failure rather than a confusing one later.
  m3-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tools the gate needs
        run: |
          docker compose version
          docker-compose version 2>/dev/null || true
          jq --version
          openssl version

      # The project's own bootstrap: compose services, every migration, the
      # development seed and the ticket bucket. The gate below creates and removes
      # its own database, Redis index, port and bucket on top of that.
      - name: Bootstrap the stack
        env:
          API_ENV: development
        run: make bootstrap

      - name: Verify M3 checkout, tickets and PDF delivery
        run: make verify-m3

  # The M4.1 gate is its own job for the same reason the two above are: it starts the three
  # compose services, bootstraps the stack, and then proves the door — a redemption over
  # HTTP only, the second presentation, a forged code and two doors racing one ticket.
  # `make verify-m41` creates and removes its own database, Redis logical database (11, so it
  # never shares an index with the other gates), API port and bucket. It needs jq, openssl
  # and curl, all of which the runner image carries; they are checked here so a missing tool
  # is a clear failure rather than a confusing one later.
  m41-door:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tools the gate needs
        run: |
          docker compose version
          docker-compose version 2>/dev/null || true
          jq --version
          openssl version
          curl --version | head -n 1

      # The project's own bootstrap: compose services, every migration, the development
      # seed and the ticket bucket. The gate below creates and removes its own on top.
      - name: Bootstrap the stack
        env:
          API_ENV: development
        run: make bootstrap

      # Quoted because the step name carries a colon: an unquoted `: ` inside a plain scalar
      # makes the whole workflow file unparseable, and GitHub then reports a run with zero
      # jobs instead of an invalid-file error where a reader would look for it.
      - name: "Verify M4.1 door: admission, second presentation, forgery and the race"
        run: make verify-m41

  # The ticket email gate is its own job for the same reason the three above are: it starts
  # the three compose services, bootstraps the stack, and then proves the mail path end to
  # end — a sale paid with an address is mailed exactly one message carrying a signed
  # /t/<token> link, that token opens the order's own tickets, the outbox row is already
  # published while the mailbox still holds one message, and the resend route is bounded.
  # `make verify-email` starts Mailpit itself (`docker compose --profile mail up -d --wait
  # mailpit`) because a mail server is the environment the claim is made in, and it stops it
  # again only when this job is what started it. It creates and removes its own database,
  # Redis logical database (12, so it never shares an index with the other gates), API port
  # and bucket. It needs Docker Compose, Go, jq and curl, all of which the runner image
  # carries; they are checked here so a missing tool is a clear failure rather than a
  # confusing one later. Nothing in the existing gates is changed by this job: they keep
  # running with no mail provider at all, which is the direction S5 promises.
  email-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tools the gate needs
        run: |
          docker compose version
          docker-compose version 2>/dev/null || true
          jq --version
          curl --version | head -n 1

      # The project's own bootstrap: compose services, every migration, the development
      # seed and the ticket bucket. The gate below creates and removes its own on top.
      - name: Bootstrap the stack
        env:
          API_ENV: development
        run: make bootstrap

      - name: Verify ticket email delivery through Mailpit
        run: make verify-email

  # The identity gate is its own job for the same reason the four above are: it starts the three
  # compose services, bootstraps the stack, and then proves the login end to end — a sale paid with
  # an address, a sign-in link mailed to it and spent once, the session row that holds the token's
  # SHA-256, the order that address claims, the account's own list, the bound of three links per
  # address and the opaque 401 every unusable session shares. `make verify-identity` starts Mailpit
  # itself (`docker compose --profile mail up -d --wait mailpit`) because the login is mail, and it
  # stops it again only when this job is what started it. It creates and removes its own database,
  # Redis logical database (13, so it never shares an index with the other gates), API port and
  # bucket. It needs Docker Compose, Go, jq and curl, all of which the runner image carries; they
  # are checked here so a missing tool is a clear failure rather than a confusing one later.
  # Nothing in the existing gates is changed by this job: verify-m3, verify-m35, verify-m41 and
  # verify-email keep running exactly as they are.
  identity-login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tools the gate needs
        run: |
          docker compose version
          docker-compose version 2>/dev/null || true
          jq --version
          curl --version | head -n 1

      # The project's own bootstrap: compose services, every migration, the development
      # seed and the ticket bucket. The gate below creates and removes its own on top.
      - name: Bootstrap the stack
        env:
          API_ENV: development
        run: make bootstrap

      - name: "Verify the guest login: the mailed link, the session, the list and the bound"
        run: make verify-identity

  # The M3.5 gate is its own job for the same reason m3-checkout is: it starts the three
  # compose services, bootstraps the stack, and then adds a real browser. It installs two
  # engines — Chromium and Firefox, with the system libraries they need — because a single
  # engine made "works in the browser" mean "works in Chromium". `make verify-m35` creates
  # and removes its own database, Redis index, ports and bucket; it builds the web
  # application once and serves that build rather than running `next dev`, so nothing here
  # races over `.next`. It also serves the web on this runner's non-loopback IPv4 address
  # instead of loopback, because loopback is a secure context and a gate pointed at it
  # cannot see anything the browser decides by origin; the gate fails rather than fall back
  # to loopback, so this runner must always have a non-loopback address.
  m35-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      # Two engines, and `--with-deps` installs the system libraries both need on the
      # runner image, which is what makes the gate fail on a product defect rather than on
      # a missing shared object. Naming both here keeps the install in step with
      # apps/web/playwright.config.ts: a project whose engine is not installed fails the
      # gate before it can run.
      - name: Install Chromium and Firefox for Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium firefox

      # The project's own bootstrap: compose services, every migration, the development
      # seed and the ticket bucket. The gate below creates and removes its own on top.
      - name: Bootstrap the stack
        env:
          API_ENV: development
        run: make bootstrap

      - name: Verify M3.5 purchase and administration in a browser
        run: make verify-m35

      # A failing browser gate is only diagnosable from what the browser wrote, and until
      # this step existed those files never left the runner: `gh api .../artifacts` reported
      # `total_count: 0` for every failure, which is why the trace, the screenshot and
      # error-context.md of #78, #84 and #80 were lost with the run. The gate already keeps
      # them outside the repository, in `${TMPDIR:-/tmp}/cinema-m35-verify-<n>-artifacts`, and
      # prints the directory it used on stderr, so this uploads what it left behind.
      #
      # Both candidate roots are listed because the gate resolves `${TMPDIR:-/tmp}` and a
      # runner is not guaranteed to point TMPDIR at RUNNER_TEMP; naming only one would make
      # the upload depend on that guess. `if-no-files-found: warn` keeps a missing path from
      # replacing the real failure with an upload error, and `if: failure()` keeps a green
      # run from paying for an archive nobody reads.
      - name: Keep the browser gate's artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m35-playwright-artefacts
          path: |
            ${{ runner.temp }}/cinema-m35-verify-*-artifacts
            /tmp/cinema-m35-verify-*-artifacts
          if-no-files-found: warn
          retention-days: 7
