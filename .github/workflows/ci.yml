name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify M0 foundation
        run: make verify-m0

      - name: Verify M1 venue and layout flow
        run: make verify-m1

      # The milestone's exit evidence: one winner in sixteen contenders, the
      # durable expiry worker, and recovery after a killed sweep. It needs the
      # compose dependencies, which the previous steps already started.
      - name: Verify M2 reservation core
        run: make verify-m2
