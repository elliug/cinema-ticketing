name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify M0 foundation
        run: make verify-m0

      - name: Verify M1 venue and layout flow
        run: make verify-m1

      # The milestone's exit evidence: one winner in sixteen contenders, the
      # durable expiry worker, and recovery after a killed sweep. It needs the
      # compose dependencies, which the previous steps already started.
      - name: Verify M2 reservation core
        run: make verify-m2

  # The M3 gate is its own job so the foundation checks keep their shape and their
  # runtime: this one starts the same three compose services (Floci is pinned by
  # digest in the compose file), bootstraps the stack the way a developer does, and
  # then proves the milestone end to end against them — a hold, a payment, the
  # tickets, the signed code, the PDF in the bucket and its survival across a Floci
  # restart. `make verify-m3` also refuses to run without jq and openssl, which the
  # runner image carries; they are checked explicitly so a missing tool is a clear
  # failure rather than a confusing one later.
  m3-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tools the gate needs
        run: |
          docker compose version
          docker-compose version 2>/dev/null || true
          jq --version
          openssl version

      # The project's own bootstrap: compose services, every migration, the
      # development seed and the ticket bucket. The gate below creates and removes
      # its own database, Redis index, port and bucket on top of that.
      - name: Bootstrap the stack
        env:
          API_ENV: development
        run: make bootstrap

      - name: Verify M3 checkout, tickets and PDF delivery
        run: make verify-m3

  # The M3.5 gate is its own job for the same reason m3-checkout is: it starts the three
  # compose services, bootstraps the stack, and then adds a real browser. It installs one
  # browser — Chromium, with the system libraries it needs — because the milestone
  # verifies behaviour (buying a seat, administering a screening), not cross-browser
  # parity. `make verify-m35` creates and removes its own database, Redis index, ports and
  # bucket; it builds the web application once and serves that build rather than running
  # `next dev`, so nothing here races over `.next`.
  m35-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v5
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      # One browser and only one. `--with-deps` installs the system libraries Chromium
      # needs on the runner image, which is what makes the gate fail on a product defect
      # rather than on a missing shared object.
      - name: Install Chromium for Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      # The project's own bootstrap: compose services, every migration, the development
      # seed and the ticket bucket. The gate below creates and removes its own on top.
      - name: Bootstrap the stack
        env:
          API_ENV: development
        run: make bootstrap

      - name: Verify M3.5 purchase and administration in a browser
        run: make verify-m35
