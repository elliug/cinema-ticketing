name: cinema-ticketing

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
      POSTGRES_USER: ${POSTGRES_USER:-cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Floci is the local S3 for the M3 ticket PDFs. The image ships its own
  # HEALTHCHECK (a shell probe of /_floci/init), so compose reports the container
  # healthy and `docker compose up --wait` is meaningful; no extra healthcheck is
  # added because the image carries neither curl nor wget to write one with.
  # Scripts still poll http://127.0.0.1:4566/_floci/health from the host.
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    volumes:
      # Floci persists its objects under /app/data (FLOCI_STORAGE_PERSISTENT_PATH),
      # so the named volume is mounted there.
      - floci-data:/app/data
    restart: unless-stopped

  migrate:
    image: postgres:17.6-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-cinema}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cinema_local_only}
      DB_NAME: ${POSTGRES_DB:-cinema}
      MIGRATIONS_DIR: /workspace/db/migrations
      MIGRATION_DIRECTION: ${MIGRATION_DIRECTION:-up}
      MIGRATION_VERSION: ${MIGRATION_VERSION:-0001_init}
    volumes:
      - ./db:/workspace/db:ro
      - ./scripts/migrations:/workspace/scripts/migrations:ro
    entrypoint: ["/bin/sh", "/workspace/scripts/migrations/apply.sh"]

  migration-verify:
    image: postgres:17.6-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-cinema}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cinema_local_only}
      DB_NAME: cinema_m0_verify
      MIGRATIONS_DIR: /workspace/db/migrations
    volumes:
      - ./db:/workspace/db:ro
      - ./scripts/migrations:/workspace/scripts/migrations:ro
      - ./tests/migrations:/workspace/tests/migrations:ro
    entrypoint: ["/bin/sh", "/workspace/scripts/migrations/verify_migrations.sh"]

volumes:
  postgres-data:
  redis-data:
  floci-data:
