name: cinema-ticketing

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
      POSTGRES_USER: ${POSTGRES_USER:-cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    # noeviction is required: the seat hold keys carry a TTL, and an eviction
    # policy could drop a hold key before its TTL and let a second buyer hold the
    # same seat.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Floci is the local S3 for the M3 ticket PDFs. The image is pinned by digest
  # because CI starts it on every run, so a moved `latest` tag cannot change what
  # the verification runs against. The image ships its own HEALTHCHECK (a shell
  # probe of /_floci/init), so compose reports the container healthy and
  # `docker compose up --wait` is meaningful; no extra healthcheck is added
  # because the image carries neither curl nor wget to write one with. Scripts
  # still poll http://127.0.0.1:4566/_floci/health from the host.
  floci:
    image: floci/floci@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    environment:
      # Floci's S3 storage defaults to memory mode, where objects live in the process
      # and vanish on any restart — the named volume below stored nothing on its own.
      # This setting is what makes the storage durable, and mounting the volume on the
      # image's persistent path (/app/data, see below) is what carries the objects
      # across a restart and across a container recreation.
      FLOCI_STORAGE_SERVICES_S3_MODE: persistent
    volumes:
      # The directory the persistent store writes to (the image already sets
      # FLOCI_STORAGE_PERSISTENT_PATH=/app/data), so the ticket PDFs survive a
      # `docker compose restart floci`, a `--force-recreate` and a `docker compose down`.
      - floci-data:/app/data
    restart: unless-stopped

  migrate:
    image: postgres:17.6-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-cinema}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cinema_local_only}
      DB_NAME: ${POSTGRES_DB:-cinema}
      MIGRATIONS_DIR: /workspace/db/migrations
      MIGRATION_DIRECTION: ${MIGRATION_DIRECTION:-up}
      MIGRATION_VERSION: ${MIGRATION_VERSION:-0001_init}
    volumes:
      - ./db:/workspace/db:ro
      - ./scripts/migrations:/workspace/scripts/migrations:ro
    entrypoint: ["/bin/sh", "/workspace/scripts/migrations/apply.sh"]

  # apply_all applies every pending migration in version order and skips the ones
  # already recorded, so `make migrate-all` is re-runnable and works on a database
  # that has never been migrated. DB_NAME can be overridden, which is how the
  # bootstrap verification points it at a throwaway database.
  migrate-all:
    image: postgres:17.6-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-cinema}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cinema_local_only}
      DB_NAME: ${POSTGRES_DB:-cinema}
      MIGRATIONS_DIR: /workspace/db/migrations
    volumes:
      - ./db:/workspace/db:ro
      - ./scripts/migrations:/workspace/scripts/migrations:ro
    entrypoint: ["/bin/sh", "/workspace/scripts/migrations/apply_all.sh"]

  migration-verify:
    image: postgres:17.6-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-cinema}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cinema_local_only}
      DB_NAME: cinema_m0_verify
      MIGRATIONS_DIR: /workspace/db/migrations
    volumes:
      - ./db:/workspace/db:ro
      - ./scripts/migrations:/workspace/scripts/migrations:ro
      - ./tests/migrations:/workspace/tests/migrations:ro
    entrypoint: ["/bin/sh", "/workspace/scripts/migrations/verify_migrations.sh"]

volumes:
  postgres-data:
  redis-data:
  floci-data:
